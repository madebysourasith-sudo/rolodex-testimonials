<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rolodex Testimonials</title>
<link href="https://api.fontshare.com/v2/css?f[]=switzer@300,400,500,600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* ROLODEX TESTIMONIALS: a testimonials section whose carousel is a vintage rotary card file. Chrome tube frame, black
   knurled knobs, a drum of cream index cards clipped onto two rails. The upright card is the active testimonial
   (mirrored to screen readers through #live). It turns on its own; tap a knob or the card, roll a knob like a real rotary file,
   drag the upright card up / down, shift-scroll (or scroll once engaged) over it,
   use the arrows, the dots or the keyboard: the drum snaps card by card, the front card flips forward and the next
   one drops into place. Everything printed comes from CONFIG. */
:root{--sans:"Switzer","Helvetica Neue",Arial,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;
  --paper:#f1ede5;--ink:#1f1c18;--mute:#6f675c;--hair:rgba(31,28,24,.075)}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.tst{position:relative;max-width:1440px;margin:0 auto;min-height:100vh;padding:56px clamp(24px,5vw,88px);
  display:grid;grid-template-columns:minmax(0,4.6fr) minmax(0,7.4fr);column-gap:clamp(24px,3vw,56px);align-items:center}
/* layout hairlines, the studio grid the section sits on */
.tst::before,.tst::after{content:"";position:absolute;top:0;bottom:0;width:1px;background:var(--hair);pointer-events:none}
.tst::before{left:clamp(24px,5vw,88px)}
.tst::after{right:clamp(24px,5vw,88px)}
.hline{position:absolute;left:0;right:0;height:1px;background:var(--hair);pointer-events:none}

.intro{position:relative;z-index:1;padding-left:clamp(0px,1.6vw,28px)}
.eyebrow{margin:0 0 22px;font:500 12px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ink)}
.intro h2{margin:0;font-weight:500;font-size:clamp(44px,4.1vw,66px);line-height:.98;letter-spacing:-.04em;text-wrap:balance}
@media (min-width:820px){.intro h2{white-space:nowrap}}
.rating{display:flex;align-items:center;gap:10px;margin:26px 0 0;font-size:18px;color:var(--mute);font-variant-numeric:tabular-nums}
.rating .score{color:var(--ink);font-weight:500}
.stars{position:relative;display:inline-block;height:16px;line-height:0}
.stars span{display:flex;gap:3px;height:16px}
.stars svg{width:16px;height:16px;flex:none;display:block}
.stars .bg{color:#d3cbbd}
.stars .fg{position:absolute;inset:0 auto 0 0;overflow:hidden;color:var(--ink)}
.lede{margin:28px 0 0;max-width:33ch;font-size:16px;line-height:1.55;color:var(--mute)}
.who{margin:40px 0 0;display:flex;gap:14px;align-items:baseline;font:500 11px/1.4 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.who b{font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.file{position:relative;display:flex;flex-direction:column;align-items:stretch;min-width:0}
.stage{position:relative;height:min(84vh,820px);min-height:540px;outline:none;border-radius:20px}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y;-webkit-tap-highlight-color:transparent}
/* touch grips over the upright card and the knobs: only there does a vertical swipe turn the drum, elsewhere it scrolls the page */
.grip{position:absolute;touch-action:none;pointer-events:none;-webkit-tap-highlight-color:transparent}
@media (pointer:coarse){.grip{pointer-events:auto}}
.stage canvas.grab{cursor:grab}
.stage canvas.turn{cursor:ns-resize}
.stage canvas.drag{cursor:grabbing}
.stage:focus-visible::after{content:"";position:absolute;inset:10px;border:1px dashed rgba(31,28,24,.55);border-radius:16px;pointer-events:none}

.controls{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin:4px auto 0;width:min(100%,520px)}
.controls[hidden]{display:none}
.arr{width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--ink);cursor:pointer;display:grid;place-items:center;
  transition:background .2s,transform .15s}
.arr:hover{background:rgba(31,28,24,.06)}
.arr:active{transform:scale(.94)}
.arr svg{width:18px;height:18px;display:block}
.dots{display:flex;justify-content:center;gap:2px}
.dot{width:24px;height:44px;border:0;background:transparent;padding:0;cursor:pointer;display:grid;place-items:center}
.dot::before{content:"";width:7px;height:7px;border-radius:50%;background:#cdc5b7;transition:background .25s,transform .25s}
.dot:hover::before{background:#a59c8e}
.dot[aria-current="true"]::before{background:var(--ink);transform:scale(1.15)}
.arr:focus-visible,.dot:focus-visible{outline:1.5px solid var(--ink);outline-offset:-4px;border-radius:50%}
.dot:focus-visible{border-radius:10px}

#grain{position:fixed;inset:0;width:100%;height:100%;opacity:.06;mix-blend-mode:overlay;pointer-events:none;z-index:50}
.cap{position:fixed;left:24px;bottom:20px;margin:0;font:500 10px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--mute);z-index:4}

@media (max-width:819px){
  .tst{grid-template-columns:minmax(0,1fr);align-items:start;padding:44px 16px 64px;row-gap:8px}
  .tst::before{left:16px}.tst::after{right:16px}
  .intro{padding:0 4px}
  .eyebrow{margin-bottom:16px;font-size:11px}
  .intro h2{font-size:clamp(40px,11vw,56px)}
  .rating{margin-top:18px;font-size:16px}
  .lede{margin-top:16px;font-size:15px}
  .who{display:none}
  .stage{height:min(130vw,560px);min-height:420px;margin:0 -16px}
  .controls{margin-top:0}
  .cap{left:50%;transform:translateX(-50%);bottom:16px;white-space:nowrap}
}
@media (prefers-reduced-motion:reduce){.dot::before,.arr{transition:none}}
</style></head>
<body>
<section class="tst" id="testimonials" role="region" aria-roledescription="carousel" aria-labelledby="tst-h">
  <div class="hline" style="top:50%" aria-hidden="true"></div>
  <div class="intro">
    <p class="eyebrow" id="tst-eyebrow"></p>
    <h2 id="tst-h"></h2>
    <p class="rating">
      <span class="score" id="tst-score"></span>
      <span class="stars" role="img" id="tst-stars"><span class="bg"></span><span class="fg"></span></span>
      <span aria-hidden="true">·</span>
      <span id="tst-count"></span>
    </p>
    <p class="lede" id="tst-lede"></p>
    <p class="who" aria-hidden="true"><b id="tst-num">01 / 06</b><span id="tst-from"></span></p>  </div>
  <div class="file">
    <div class="stage" id="stage" tabindex="0" role="group" aria-roledescription="slide" aria-describedby="tst-hint">
      <canvas id="cv" aria-hidden="true"></canvas>
      <div class="grip" id="grip-card" aria-hidden="true"></div><div class="grip" id="grip-k0" aria-hidden="true"></div><div class="grip" id="grip-k1" aria-hidden="true"></div>
      <p class="sr" id="tst-hint">Card file. Arrow keys flip to the next or previous card, Home and End jump to the first and last.</p>
      <div class="sr" id="live" aria-live="polite" aria-atomic="true"></div>
    </div>
    <div class="controls">
      <button type="button" class="arr" id="prev" aria-controls="stage" aria-label="Previous testimonial"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M11 3.5 5.5 9l5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
      <div class="dots" id="dots" role="group" aria-label="Choose a testimonial"></div>
      <button type="button" class="arr" id="next" aria-controls="stage" aria-label="Next testimonial"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M7 3.5 12.5 9 7 14.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
    </div>
  </div>
</section>
<p class="cap">Rolodex · Testimonials</p>
<svg id="grain" aria-hidden="true"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1 0"/></filter><rect width="100%" height="100%" filter="url(#noise)"/></svg>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =====================================================================================================================
   CONFIG: everything printed on the page and on the cards comes from here.
   - eyebrow, heading, lede         left column copy
   - rating (0..5), count, countLabel   the rating summary "4.9 ★★★★★ · 120 reviews"
   - testimonials: one index card each, in drum order (the drum loops forever).
       quote    the testimonial (auto-fitted to the card; best under ~190 characters)
       name     person, printed in mono caps
       role     job title
       company  company name
       mark     optional logo mark: 'triangle' | 'ring' | 'bars' | 'arc' | 'diamond' | 'squares'
       tab      optional celluloid tab colour (css colour)
   - cardsInDrum   physical cards on the drum (rounded up to a multiple of testimonials.length)
   - sound, volume subtle WebAudio paper flip per card
   - autoplay      ms between flips when nobody is touching it (0 = off); showControls  arrows + dots
   - startIndex    first card shown

   EVENTS  #testimonials dispatches 'testimonialchange' (bubbles) when the active card changes:
           e.detail = { index, testimonial }
   API     window.rolodex = { go(i), next(), prev(), get index(), el }
   KEYS    on the card file: ArrowDown / ArrowRight next, ArrowUp / ArrowLeft previous, Home / End
   POINTER tap the upright card or a knob to flip one card. Roll a knob like a real rotary file: it is geared 1:1 to
           the drum under your finger, and a hard spin keeps rolling. Drag the upright card too. (Touch: only on the
           card / knobs, elsewhere the page scrolls.)
           Wheel: horizontal or shift-wheel always turns; plain vertical wheel only within 2.5 s of interacting.
   ===================================================================================================================== */
const CONFIG = {
  eyebrow: 'Testimonials',
  heading: 'What clients say',
  rating: 4.9,
  count: 120,
  countLabel: 'reviews',
  lede: 'Founders, editors and in-house teams on what it is like to build with the studio, kept on file.',
  cardsInDrum: 24,
  sound: true,           // paper flip per card (browsers only allow audio after the visitor's first click / key / tap)
  volume: 0.55,
  startIndex: 0,
  autoplay: 3000,       // ms between flips, the drum turns on its own forever (0 = off). Pauses while dragged,
                         // while the file has keyboard focus, off-screen, in a hidden tab and under reduced motion.
  showControls: false,   // arrows + dots under the file
  testimonials: [
    { quote: 'They didn’t just redesign our website, they rebuilt how we talk about ourselves. Six months on, every pitch deck still borrows from that work.', name: 'Mara Ilves', role: 'Founder', company: 'Northfold Studio', mark: 'triangle' },
    { quote: 'The calmest launch we have ever had. Every decision came with a reason, and every reason held up in front of our board.', name: 'Tomás Reyna', role: 'Head of Product', company: 'Lumen & Hart', mark: 'ring' },
    { quote: 'They treat a type scale the way a carpenter treats a joint. You never notice it, you only notice that nothing creaks.', name: 'Ines Okafor', role: 'Creative Director', company: 'Paperweight', mark: 'bars' },
    { quote: 'Bookings doubled in the first quarter. Better still, people started writing in to say the new site simply felt kind.', name: 'Jonah Feld', role: 'Owner', company: 'Feld Ceramics', mark: 'arc' },
    { quote: 'Clear scope, honest timelines, no theatre. We would hire them again tomorrow. Actually, we already have.', name: 'Saskia Brandt', role: 'COO', company: 'Orrin Mobility', mark: 'diamond' },
    { quote: 'Half design studio, half editor. They cut what we didn’t need and made what was left feel inevitable.', name: 'Felix Aranda', role: 'Editor-in-Chief', company: 'Quarterly Field', mark: 'squares' }
  ]
};
</script>
<script>
(() => {
'use strict';
const T = CONFIG.testimonials, N = T.length;
const $ = id => document.getElementById(id);
const section = $('testimonials'), stage = $('stage'), canvas = $('cv');
const reduced = matchMedia('(prefers-reduced-motion: reduce)');
const mod = (a, n) => ((a % n) + n) % n;
const pad = n => String(n).padStart(2, '0');
const TAB_COLORS = ['#c9573f', '#d9a441', '#8ea489', '#5f80a8', '#c98f8a', '#7d8b6a'];

/* ---------- DOM copy ---------- */
$('tst-eyebrow').textContent = CONFIG.eyebrow;
$('tst-h').textContent = CONFIG.heading;
$('tst-score').textContent = CONFIG.rating.toFixed(1);
$('tst-count').textContent = `${CONFIG.count} ${CONFIG.countLabel}`;
$('tst-lede').textContent = CONFIG.lede;
const STAR = '<svg viewBox="0 0 16 16"><path fill="currentColor" d="M8 .9l2.1 4.6 5 .5-3.8 3.4 1.1 4.9L8 11.8l-4.4 2.5 1.1-4.9L.9 6l5-.5z"/></svg>';
document.querySelectorAll('#tst-stars span').forEach(s => s.innerHTML = STAR.repeat(5));
$('tst-stars').setAttribute('aria-label', `Rated ${CONFIG.rating} out of 5`);
$('tst-stars').querySelector('.fg').style.width = `calc(${(CONFIG.rating / 5) * 100}% )`;
const dotsEl = $('dots');
const dots = T.map((t, i) => {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'dot';
  b.setAttribute('aria-label', `Testimonial ${i + 1} of ${N}: ${t.name}, ${t.company}`);
  b.addEventListener('click', () => api.go(i));
  dotsEl.appendChild(b); return b;
});

/* ---------- geometry constants (metres-ish) ---------- */
const CW = 1.6, BODY = 1.04, TAB = 0.085, TOT = BODY + TAB, R0 = 0.135, THICK = 0.006;
const RAIL_R = 0.175, RAIL_X = 0.24, LEG_X = 0.9, FOOT_Z = 0.64;
const FLOOR_C = -(R0 + TOT) - 0.075, TUBE_R = 0.03, FLOOR = FLOOR_C - TUBE_R;
const C = N * Math.max(2, Math.ceil(CONFIG.cardsInDrum / N)), HALF = C / 2;
const GAP = 0.3, FWD = 2.8;             // first card behind leans 17°, fallen cards hang 160°+, packed under the drum

/* ---------- renderer / scene ---------- */
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setClearColor(0x000000, 0);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.physicallyCorrectLights = false;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(24, 1, 0.5, 60);

/* environment: a soft studio room baked into a PMREM so the chrome has something to reflect */
(function buildEnv() {
  const env = new THREE.Scene();
  const room = new THREE.Mesh(new THREE.BoxGeometry(24, 12, 24), new THREE.MeshBasicMaterial({ color: 0x0b0a09, side: THREE.BackSide }));
  room.position.y = 4; env.add(room);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(24, 24), new THREE.MeshBasicMaterial({ color: 0x050505 }));
  floor.rotation.x = -Math.PI / 2; floor.position.y = -1.9; env.add(floor);
  const box = (w, h, c, k, pos, rot) => {
    const m = new THREE.MeshBasicMaterial({ color: new THREE.Color(c).multiplyScalar(k), side: THREE.DoubleSide });
    const p = new THREE.Mesh(new THREE.PlaneGeometry(w, h), m); p.position.set(...pos); p.rotation.set(...rot); env.add(p);
  };
  // crisp strip lights: the chrome picks these up as clean white bands against a near-black room
  box(14, 1.0, 0xfff6ea, 7.0, [0, 9.8, 1.6], [Math.PI / 2, 0, 0]);
  box(14, 0.5, 0xfff6ea, 4.5, [0, 9.8, -2.4], [Math.PI / 2, 0, 0]);
  box(1.3, 9, 0xfff3e6, 8.0, [-9.5, 3.5, 3], [0, Math.PI / 2, 0]);
  box(0.7, 9, 0xe8eeff, 4.0, [9.5, 3.5, -1.5], [0, -Math.PI / 2, 0]);
  box(9, 0.6, 0xffffff, 3.2, [0, 1.2, 11.5], [0, Math.PI, 0]);
  box(8, 0.5, 0xfff2e2, 3.0, [0, 2.4, -11.8], [0, 0, 0]);
  box(5, 0.35, 0xf3eadc, 1.6, [2, -1.85, 5], [-Math.PI / 2, 0, 0]);   // the page catching a little light
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(env, 0.035).texture;
  pm.dispose();
})();

scene.add(new THREE.HemisphereLight(0xfffaf2, 0x8b8273, 0.62));
const key = new THREE.DirectionalLight(0xfff4e6, 2.1);
key.position.set(-2.4, 4.6, 3.1);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -2.6, right: 2.6, top: 2.6, bottom: -2.6, near: 1, far: 12 });
key.shadow.radius = 3.2;
key.shadow.bias = -0.0005;
key.shadow.normalBias = 0.012;
scene.add(key);
const fill = new THREE.DirectionalLight(0xe6ecfa, 0.35);
fill.position.set(3, 1.2, 2.5); scene.add(fill);

/* ---------- materials ---------- */
const chrome = new THREE.MeshStandardMaterial({ color: 0xf2f0ec, metalness: 1, roughness: 0.07, envMapIntensity: 1.35 });
const knobMat = new THREE.MeshStandardMaterial({ color: 0x050505, metalness: 0, roughness: 0.3, envMapIntensity: 1.0 });
const knobFace = new THREE.MeshStandardMaterial({ color: 0x040404, metalness: 0, roughness: 0.2, envMapIntensity: 1.0 });
const hubMat = new THREE.MeshStandardMaterial({ color: 0x060505, metalness: 0, roughness: 0.26, envMapIntensity: 1.0 });

const rig = new THREE.Group(); scene.add(rig);

/* ---------- chrome tube frame ---------- */
function roundedPath(pts, r) {
  const path = new THREE.CurvePath(); let prev = pts[0].clone();
  for (let i = 1; i < pts.length - 1; i++) {
    const a = pts[i - 1], b = pts[i], c = pts[i + 1];
    const ab = b.clone().sub(a), bc = c.clone().sub(b);
    const rr = Math.min(r, ab.length() * 0.45, bc.length() * 0.45);
    const p1 = b.clone().sub(ab.normalize().multiplyScalar(rr)), p2 = b.clone().add(bc.normalize().multiplyScalar(rr));
    path.add(new THREE.LineCurve3(prev, p1));
    path.add(new THREE.QuadraticBezierCurve3(p1, b.clone(), p2));
    prev = p2;
  }
  path.add(new THREE.LineCurve3(prev, pts[pts.length - 1].clone()));
  return path;
}
const V = (x, y, z) => new THREE.Vector3(x, y, z);
for (const zf of [FOOT_Z, -FOOT_Z]) {
  const path = roundedPath([V(-LEG_X, 0, 0), V(-LEG_X, FLOOR_C, zf), V(LEG_X, FLOOR_C, zf), V(LEG_X, 0, 0)], 0.2);
  const tube = new THREE.Mesh(new THREE.TubeGeometry(path, 360, TUBE_R, 24, false), chrome);
  tube.castShadow = true; tube.receiveShadow = true; rig.add(tube);
}
// axle, hub, collars
const xCyl = (r, len, x, mat, seg = 48) => {
  const g = new THREE.CylinderGeometry(r, r, len, seg); g.rotateZ(Math.PI / 2);
  const m = new THREE.Mesh(g, mat); m.position.x = x; m.castShadow = true; m.receiveShadow = true; rig.add(m); return m;
};
xCyl(0.022, 2 * LEG_X + 0.06, 0, chrome);
xCyl(0.112, 2 * 0.79, 0, hubMat, 64);
for (const s of [-1, 1]) {
  xCyl(0.125, 0.02, s * 0.8, chrome, 64);
  const ball = new THREE.Mesh(new THREE.SphereGeometry(0.046, 32, 16), chrome); ball.position.x = s * LEG_X; ball.castShadow = true; rig.add(ball);
  xCyl(0.05, 0.07, s * (LEG_X + 0.045), chrome);
}
// card rails: two chrome rings the slotted card bottoms clip around
for (const s of [-1, 1]) {
  const g = new THREE.TorusGeometry(RAIL_R, 0.0085, 10, 128); g.rotateY(Math.PI / 2);
  const m = new THREE.Mesh(g, chrome); m.position.x = s * RAIL_X; m.castShadow = true; rig.add(m);
}
// knurled knobs
const KNOB_R = 0.205, KNOB_L = 0.13;
function knobGeometry() {
  const g = new THREE.CylinderGeometry(KNOB_R, KNOB_R, KNOB_L, 432, 6, false);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i), y = p.getY(i), r = Math.hypot(x, z);
    if (r < KNOB_R * 0.6) continue;
    const a = Math.atan2(z, x);
    let groove = Math.pow(Math.max(0, Math.cos(a * 54)), 4) * 0.009;
    const edge = Math.abs(y) / (KNOB_L / 2);            // chamfer the two rims
    const ch = Math.max(0, edge - 0.72) / 0.28;
    const k = (r - groove - ch * ch * 0.016) / r;
    p.setX(i, x * k); p.setZ(i, z * k);
  }
  g.computeVertexNormals(); g.rotateZ(Math.PI / 2);
  return g;
}
const kg = knobGeometry();
const knobs = [];
for (const s of [-1, 1]) {
  const grp = new THREE.Group(); grp.position.x = s * (LEG_X + 0.08 + KNOB_L / 2);
  const k = new THREE.Mesh(kg, knobMat); k.castShadow = true; k.receiveShadow = true; k.userData.knob = true; grp.add(k);
  const fg = new THREE.CylinderGeometry(KNOB_R * 0.78, KNOB_R * 0.8, 0.012, 96); fg.rotateZ(Math.PI / 2);
  const f = new THREE.Mesh(fg, knobFace); f.position.x = s * (KNOB_L / 2 + 0.002); f.userData.knob = true; grp.add(f);
  const capg = new THREE.CylinderGeometry(0.03, 0.03, 0.012, 32); capg.rotateZ(Math.PI / 2);
  const cap = new THREE.Mesh(capg, chrome); cap.position.x = s * (KNOB_L / 2 + 0.009); grp.add(cap);
  rig.add(grp); knobs.push(grp);
}

/* ---------- page: soft shadow catcher + contact shading ---------- */
const floorMesh = new THREE.Mesh(new THREE.PlaneGeometry(14, 14), new THREE.ShadowMaterial({ color: 0x3a2e20, opacity: 0.24 }));
floorMesh.rotation.x = -Math.PI / 2; floorMesh.position.y = FLOOR; floorMesh.receiveShadow = true; scene.add(floorMesh);
function blobTex() {
  const c = document.createElement('canvas'); c.width = c.height = 128; const x = c.getContext('2d');
  const g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(0.45, 'rgba(0,0,0,.45)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = g; x.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c);
}

  if (!CONFIG.sound || !actx || actx.state !== 'running' || !noiseBuf) return;
  const now = performance.now(); if (now - lastSnd < 70) return; lastSnd = now;   // fast drags: no machine-gun
  const t = actx.currentTime + 0.005, v = CONFIG.volume * (0.85 + Math.random() * 0.3);
  burst(t, 0.17, 'bandpass', 2400, 5200, 0.9, 0.16 * v, 0.018);           // rustle of the card leaving its neighbours
  burst(t + 0.02, 0.12, 'highpass', 6000, 7500, 0.7, 0.05 * v, 0.01);     // fibre crackle
  burst(t + 0.2, 0.07, 'lowpass', 1400, 500, 0.8, 0.30 * v, 0.004);       // soft tap on the packet
}

/* ---------- UI state ---------- */
let shown = -1, liveTimer = 0;
function paintUI(i) {
  dots.forEach((d, k) => d.setAttribute('aria-current', k === i ? 'true' : 'false'));
  $('tst-num').textContent = `${pad(i + 1)} / ${pad(N)}`;
  $('tst-from').textContent = `${T[i].name}, ${T[i].company}`;
}
function commit(newTarget) {
  target = newTarget; kick();
  const i = mod(target, N); paintUI(i);
  if (i === shown) return; shown = i;
  stage.setAttribute('aria-label', `Testimonial ${i + 1} of ${N}`);
  clearTimeout(liveTimer);
  liveTimer = setTimeout(() => { const t = T[i]; $('live').textContent = `“${t.quote}” ${t.name}, ${t.role}, ${t.company}.`; }, 260);
  section.dispatchEvent(new CustomEvent('testimonialchange', { bubbles: true, detail: { index: i, testimonial: T[i] } }));
}
const api = {
  go(i) { i = mod(Math.round(i), N); let dlt = mod(i - mod(target, N), N); if (dlt > N / 2) dlt -= N; commit(target + dlt); },
  next() { commit(target + 1); }, prev() { commit(target - 1); },
  get index() { return mod(target, N); }, el: section
};
window.rolodex = api;
$('prev').addEventListener('click', () => api.prev());
$('next').addEventListener('click', () => api.next());
stage.addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'ArrowDown' || k === 'ArrowRight' || k === 'PageDown') api.next();
  else if (k === 'ArrowUp' || k === 'ArrowLeft' || k === 'PageUp') api.prev();
  else if (k === 'Home') api.go(0); else if (k === 'End') api.go(N - 1);
  else return;
  e.preventDefault();
});

/* ---------- pointer: drag the cards or turn a knob ---------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const pickables = []; rig.traverse(o => { if (o.isMesh && (o.userData.knob || o.userData.card !== undefined)) pickables.push(o); });
pickables.push(rig.children.find(o => o.isMesh && o.geometry.parameters && o.geometry.parameters.radiusTop === 0.112));
function pick(e) {
  const r = canvas.getBoundingClientRect();
  ndc.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const h = ray.intersectObjects(pickables, false)[0];
  return h ? (h.object.userData.knob ? 'knob' : 'card') : null;
}
function pxPerCard() { return Math.max(60, cardCssW * 0.3); }
// a knob is geared to the drum: one card = a short arc of its rim. Measure that arc on screen so the knurl stays
// under the finger, like thumbing the wheel of a real rotary file.
const _kc = new THREE.Vector3(), _ke = new THREE.Vector3();
function knobPxPerCard() {
  const r = canvas.getBoundingClientRect(); knobs[0].getWorldPosition(_kc); _ke.copy(_kc); _ke.y += KNOB_R;
  _kc.project(camera); _ke.project(camera);
  const pxPerUnit = Math.hypot((_ke.x - _kc.x) / 2 * r.width, (_ke.y - _kc.y) / 2 * r.height) / KNOB_R;
  return Math.max(22, KNOB_R * (Math.PI * 2 / C) * 1.6 * pxPerUnit);
}
let engagedUntil = 0;
const engage = () => { engagedUntil = performance.now() + 2500; };
const grips = { card: $('grip-card'), k0: $('grip-k0'), k1: $('grip-k1') };
function placeGrips(w, h) {
  const p = new THREE.Vector3();
  const rect = (el, pts) => {
    let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
    for (const q of pts) { p.copy(q).project(camera); const x = (p.x + 1) / 2 * w, y = (1 - p.y) / 2 * h; x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
    Object.assign(el.style, { left: x0 + 'px', top: y0 + 'px', width: (x1 - x0) + 'px', height: (y1 - y0) + 'px' });
  };
  rect(grips.card, [V(-CW / 2, R0 + 0.12, 0), V(CW / 2, R0 + 0.12, 0), V(-CW / 2, R0 + TOT, 0), V(CW / 2, R0 + TOT, 0)]);
  knobs.forEach((k, i) => { const x = k.position.x, pts = []; for (const dx of [-KNOB_L, KNOB_L]) for (const dy of [-1, 1]) for (const dz of [-1, 1]) pts.push(V(x + dx / 2, dy * KNOB_R * 1.15, dz * KNOB_R)); rect(grips['k' + i], pts); });
}
function startDrag(e, what, el) {
  engage();
  stage.focus({ preventScroll: true, focusVisible: false });
  dragging = { what, el, y0: e.clientY, p0: pos, t: performance.now(), y: e.clientY, v: 0, moved: 0, touch: e.pointerType === 'touch', ppc: what === 'knob' ? knobPxPerCard() : pxPerCard() };
  vel = 0; try { el.setPointerCapture(e.pointerId); } catch (_) {}
  canvas.className = 'drag'; kick();
}
function moveDrag(e) {
  const now = performance.now(), dy = e.clientY - dragging.y, dtt = Math.max(1, now - dragging.t) / 1000;
  dragging.v = dragging.v * 0.6 + (dy / dragging.ppc / dtt) * 0.4;
  dragging.y = e.clientY; dragging.t = now; dragging.moved = Math.max(dragging.moved, Math.abs(e.clientY - dragging.y0));
  pos = dragging.p0 + (e.clientY - dragging.y0) / dragging.ppc;
  engage(); kick();
}
function endDrag() {
  if (!dragging) return;
  const d = dragging; dragging = null; canvas.className = 'grab';
  if (performance.now() - d.t > 90) d.v = 0;
  if (d.moved < 6) { pos = d.p0; commit(target + 1); return; }   // a tap on the card or a knob flips one card
  const knob = d.what === 'knob', base = Math.round(d.p0);
  let tg = Math.round(pos + d.v * (knob ? 0.3 : 0.16));               // a knob can be spun: it keeps rolling
  const span = knob ? 3 * N : 4;
  tg = Math.max(base - span, Math.min(base + span, tg));
  if (tg === base && Math.abs(pos - d.p0) > 0.22) tg = base + Math.sign(pos - d.p0);   // a short flick still flips
  vel = d.v * 0.4; commit(tg);
}
// mouse / pen: anywhere on the object. Touch on the canvas is left to the page (pan-y) so it can scroll.
canvas.addEventListener('pointerdown', e => {
  if (e.button !== 0 || e.pointerType === 'touch') return;
  const what = pick(e); if (what) startDrag(e, what, canvas);
});
canvas.addEventListener('pointermove', e => {
  if (dragging) { if (dragging.el === canvas) moveDrag(e); return; }
  if (e.pointerType === 'touch') return;
  const w = pick(e); canvas.className = w === 'knob' ? 'turn' : w ? 'grab' : '';
});
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
// touch: deliberate drags on the upright card or a knob
for (const [key, el] of Object.entries(grips)) {
  el.addEventListener('pointerdown', e => startDrag(e, key === 'card' ? 'card' : 'knob', el));
  el.addEventListener('pointermove', e => { if (dragging && dragging.el === el) moveDrag(e); });
  el.addEventListener('pointerup', endDrag);
  el.addEventListener('pointercancel', endDrag);
}
// wheel: horizontal or shift-wheel always turns the drum; a plain vertical wheel only once the user is working the
// file (dragged, clicked, used keys or arrows in the last 2.5 s) - otherwise the page scrolls as normal
let wheelAcc = 0, wheelT = 0;
canvas.addEventListener('wheel', e => {
  const horiz = Math.abs(e.deltaX) > Math.abs(e.deltaY);
  if (!horiz && !e.shiftKey && performance.now() > engagedUntil) return;
  e.preventDefault(); engage();
  wheelAcc += (horiz ? e.deltaX : e.deltaY || e.deltaX) * (e.deltaMode === 1 ? 16 : 1);
  const now = performance.now();
  if (Math.abs(wheelAcc) > 40 && now - wheelT > 160) { commit(target + Math.sign(wheelAcc)); wheelAcc = 0; wheelT = now; }
}, { passive: false });
['prev', 'next'].forEach(id => $(id).addEventListener('click', engage));
dotsEl.addEventListener('click', engage);
stage.addEventListener('keydown', engage);

/* ---------- autoplay: the file keeps turning on its own ---------- */
if (!CONFIG.showControls) document.querySelector('.controls').hidden = true;
let autoT = 0, inView = true, kbdFocus = false;
const live = $('live');
function autoPaused() { return !CONFIG.autoplay || reduced.matches || dragging || kbdFocus || document.hidden || !inView; }
function schedule() {
  clearTimeout(autoT);
  live.setAttribute('aria-live', autoPaused() ? 'polite' : 'off');   // no announcement every few seconds while it rolls
  if (autoPaused()) return;
  autoT = setTimeout(() => { if (!autoPaused()) commit(target + 1); schedule(); }, CONFIG.autoplay);
}
new IntersectionObserver(es => { inView = es[0].isIntersecting; schedule(); }, { threshold: 0.2 }).observe(stage);
document.addEventListener('visibilitychange', schedule);
reduced.addEventListener?.('change', schedule);
let usingKeys = false;   // only a keyboard user parking on the file pauses it, not the focus a drag gives it
document.addEventListener('keydown', () => { usingKeys = true; }, true);
document.addEventListener('pointerdown', () => { usingKeys = false; }, true);
stage.addEventListener('focus', () => { kbdFocus = usingKeys; schedule(); });
stage.addEventListener('keydown', () => { if (!kbdFocus) { kbdFocus = true; schedule(); } });
stage.addEventListener('blur', () => { kbdFocus = false; schedule(); });
for (const el of [canvas, ...Object.values(grips)]) { el.addEventListener('pointerdown', () => clearTimeout(autoT)); el.addEventListener('pointerup', () => setTimeout(schedule, 0)); el.addEventListener('pointercancel', () => setTimeout(schedule, 0)); }
['prev', 'next'].forEach(id => $(id).addEventListener('click', schedule)); dotsEl.addEventListener('click', schedule);

/* ---------- boot ---------- */
async function boot() {
  try {
    await Promise.race([Promise.all([document.fonts.load('400 40px Switzer'), document.fonts.load('500 30px "JetBrains Mono"')]), new Promise(r => setTimeout(r, 2500))]);
  } catch (e) { /* draw with fallbacks */ }
  fit();
  if (!reduced.matches) { pos = target - 5; lastRound = Math.round(pos); }
  commit(target);
  layout(0); renderer.render(scene, camera); kick();
  schedule();
  let rt = 0;
  new ResizeObserver(() => { cancelAnimationFrame(rt); rt = requestAnimationFrame(() => { fit(); layout(0); renderer.render(scene, camera); }); }).observe(stage);
  // fonts can finish after the first draw on a slow connection: redraw once they settle
  document.fonts.ready.then(() => { texSig = ''; fit(); layout(0); renderer.render(scene, camera); });
}
paintUI(mod(target, N));
boot();
})();
</script>
